name: Deploy to InfinityFree via FTP

on:
  push:
    branches: [ main, master ]

jobs:
  web-deploy:
    name: Deploy to InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: ?? Get latest code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ?? Build Project
        run: |
          npm install --force
          npm run build:pages

      - name: ?? Sync to InfinityFree FTP (htdocs)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: if0_42922540
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD || 'aeirmist1012' }}
          local-dir: ./dist/
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/*.map
